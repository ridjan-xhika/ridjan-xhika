<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-labelledby="title desc">
<title id="title">Ridjan Xhika — software, security and systems</title>
<desc id="desc">Original artwork for Ridjan Xhika's GitHub profile. Animations respect reduced-motion preferences.</desc>
<style>
text { font-family: Space Grotesk,Inter,Segoe UI,Arial,sans-serif; }
.mono { font-family: ui-monospace,SFMono-Regular,Consolas,monospace; }

.float { animation: drift 8s ease-in-out infinite; }
.orbit { transform-origin: 754px 165px; animation: orbit 45s linear infinite; }
.pulse { animation: pulse 3.5s ease-in-out infinite; }
.blink { animation: blink 2s steps(2,end) infinite; }
@keyframes drift { 50% { transform: translateY(-7px); } }
@keyframes orbit { to { transform: rotate(360deg); } }
@keyframes pulse { 50% { opacity:.35; } }
@keyframes blink { 50% { opacity:0; } }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>

<defs>
  <linearGradient id="background" x2="1" y2="1"><stop stop-color="#162015"/><stop offset="1" stop-color="#101411"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#b5e98a" stop-opacity=".2"/><stop offset="1" stop-color="#b5e98a" stop-opacity="0"/></radialGradient>
  <linearGradient id="orb" x2="1" y2="1"><stop stop-color="#2c4a24"/><stop offset=".6" stop-color="#16221a"/><stop offset="1" stop-color="#0f150f"/></linearGradient>
  <linearGradient id="border"><stop stop-color="#d2f7ab"/><stop offset="1" stop-color="#86c95a"/></linearGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="1.1" fill="#d2f7ab" fill-opacity=".09"/></pattern>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="frame"><rect x="1" y="1" width="958" height="338" rx="24"/></clipPath>
</defs>
<rect x="1" y="1" width="958" height="338" rx="24" fill="url(#background)" stroke="#2c3a28"/>
<g clip-path="url(#frame)"><rect width="960" height="340" fill="url(#grid)"/>
<circle cx="757" cy="166" r="211" fill="url(#halo)"/><circle cx="580" cy="46" r="1" fill="#d2f7ab" opacity=".35"/><circle cx="883" cy="64" r="2" fill="#d2f7ab" opacity=".35"/><circle cx="622" cy="250" r="1" fill="#d2f7ab" opacity=".35"/><circle cx="855" cy="260" r="1" fill="#d2f7ab" opacity=".35"/><circle cx="522" cy="292" r="1" fill="#d2f7ab" opacity=".35"/><circle cx="680" cy="34" r="2" fill="#d2f7ab" opacity=".35"/><circle cx="922" cy="200" r="1" fill="#d2f7ab" opacity=".35"/><circle cx="550" cy="143" r="1" fill="#d2f7ab" opacity=".35"/>
