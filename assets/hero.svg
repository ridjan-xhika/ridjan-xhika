  <g class="orbit"><ellipse cx="754" cy="165" rx="143" ry="60" fill="none" stroke="#8fbf6d" stroke-opacity=".45" transform="rotate(-28 754 165)"/><circle cx="881" cy="103" r="4" fill="#d2f7ab"/></g>
  <circle cx="754" cy="165" r="86" fill="url(#orb)" stroke="url(#border)" stroke-width="1.5"/>
