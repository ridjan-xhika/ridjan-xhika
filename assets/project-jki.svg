<svg xmlns="http://www.w3.org/2000/svg" width="468" height="214" viewBox="0 0 468 214" role="img" aria-labelledby="title desc">
<title id="title">JKI / Jake — A voice for your Linux desktop. Wake word, local speech, real actions.</title>
<desc id="desc">Original artwork for Ridjan Xhika's GitHub profile. Animations respect reduced-motion preferences.</desc>
<style>
text { font-family: Inter,Segoe UI,Arial,sans-serif; }
.mono { font-family: ui-monospace,SFMono-Regular,Consolas,monospace; }
.w0 { transform-origin: 2px 25px; animation: wave 1.1s ease-in-out infinite; }.w1 { transform-origin: 11px 25px; animation: wave 1.2400000000000002s ease-in-out infinite; }.w2 { transform-origin: 20px 25px; animation: wave 1.3800000000000001s ease-in-out infinite; }.w3 { transform-origin: 29px 25px; animation: wave 1.52s ease-in-out infinite; }.w4 { transform-origin: 38px 25px; animation: wave 1.6600000000000001s ease-in-out infinite; }.w5 { transform-origin: 47px 25px; animation: wave 1.8000000000000003s ease-in-out infinite; }.w6 { transform-origin: 56px 25px; animation: wave 1.9400000000000002s ease-in-out infinite; }@keyframes wave { 50% { transform:scaleY(.3);opacity:.6; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs><linearGradient id="surface" x2="1" y2="1"><stop stop-color="#111e2f"/><stop offset="1" stop-color="#0b1220"/></linearGradient></defs>
