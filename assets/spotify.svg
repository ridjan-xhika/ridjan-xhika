<svg xmlns="http://www.w3.org/2000/svg" width="960" height="224" viewBox="0 0 960 224" role="img" aria-labelledby="title desc">
<title id="title">Coding soundtrack — Best of Anime Now 2025, curated by Spotify. Open playlist on Spotify.</title>
<desc id="desc">Original artwork for Ridjan Xhika's GitHub profile. Animations respect reduced-motion preferences.</desc>
<style>
text { font-family: Inter,Segoe UI,Arial,sans-serif; }
.mono { font-family: ui-monospace,SFMono-Regular,Consolas,monospace; }
.b0 { transform-origin:682px 113px; animation:level 1.3s ease-in-out infinite; }.b1 { transform-origin:693px 113px; animation:level 1.4300000000000002s ease-in-out infinite; }.b2 { transform-origin:704px 113px; animation:level 1.56s ease-in-out infinite; }.b3 { transform-origin:715px 113px; animation:level 1.69s ease-in-out infinite; }.b4 { transform-origin:726px 113px; animation:level 1.82s ease-in-out infinite; }.b5 { transform-origin:737px 113px; animation:level 1.9500000000000002s ease-in-out infinite; }.b6 { transform-origin:748px 113px; animation:level 2.08s ease-in-out infinite; }.b7 { transform-origin:759px 113px; animation:level 2.21s ease-in-out infinite; }.b8 { transform-origin:770px 113px; animation:level 2.34s ease-in-out infinite; }.b9 { transform-origin:781px 113px; animation:level 2.4699999999999998s ease-in-out infinite; }.b10 { transform-origin:792px 113px; animation:level 2.6s ease-in-out infinite; }.b11 { transform-origin:803px 113px; animation:level 2.7300000000000004s ease-in-out infinite; }
@keyframes level { 50% { transform:scaleY(.35);opacity:.45; } }
.star { animation:shoot 9s ease-in-out infinite; }
@keyframes shoot { 0%,70%,100% { opacity:0;transform:translate(0,0); } 75% { opacity:.8; } 90% { opacity:0;transform:translate(72px,45px); } }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>

