name: Update contribution snake

on:
  push:
    branches: [main]
    paths:
      - README.md
      - .github/workflows/snake.yml
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generate light and dark contribution snakes
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#147d70&color_dots=#ebedf0,#caece4,#90d9ca,#46bfa7,#147d70
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#65e1c6&color_dots=#161f2c,#184c4c,#23817c,#38b6a4,#65e1c6

      - name: Commit and push updated animations
        run: |
          mkdir -p assets
          cp dist/github-contribution-grid-snake.svg assets/
          cp dist/github-contribution-grid-snake-dark.svg assets/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-contribution-grid-snake.svg assets/github-contribution-grid-snake-dark.svg
          if git diff --cached --quiet; then
            echo "Contribution snake is already up to date."
          else
            git commit -m "Update contribution snake"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
